name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAG_ROOT: ${{ runner.temp }}/rag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environments/ci-requirements.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r environments/ci-requirements.txt

      - name: Run model-free CPU tests
        run: |
          python -m pytest -q \
            tests/test_final_test.py \
            tests/test_milestone4c_statistics.py \
            tests/test_passages.py \
            tests/test_reranking.py \
            tests/test_scifact_preparation.py \
            tests/test_verification.py
