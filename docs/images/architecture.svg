<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="190" viewBox="0 0 1180 190" role="img" aria-labelledby="title desc">
  <title id="title">Biomedical retrieval and verification architecture</title>
  <desc id="desc">A biomedical claim passes through BGE encoding, exact FAISS search over the SciFact corpus, top-one abstract selection, and the M2 Qwen verifier to produce a decision and rationale sentence identifiers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .accent { fill: #eff6ff; stroke: #2563eb; }
      .output { fill: #ecfdf5; stroke: #059669; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .label { fill: #0f172a; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #475569; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <path class="arrow" d="M180 100 H207"/>
  <path class="arrow" d="M367 100 H394"/>
  <path class="arrow" d="M574 100 H601"/>
  <path class="arrow" d="M751 100 H778"/>
  <path class="arrow" d="M968 100 H995"/>

  <rect class="box" x="20" y="52" width="160" height="96" rx="10"/>
  <text class="label" x="100" y="105">Biomedical claim</text>

  <rect class="box accent" x="207" y="52" width="160" height="96" rx="10"/>
  <text class="label" x="287" y="94">BGE query</text>
  <text class="label" x="287" y="116">encoder</text>

  <rect class="box accent" x="394" y="52" width="180" height="96" rx="10"/>
  <text class="label" x="484" y="88">FAISS exact search</text>
  <text class="detail" x="484" y="113">5,183 SciFact</text>
  <text class="detail" x="484" y="131">documents</text>

  <rect class="box" x="601" y="52" width="150" height="96" rx="10"/>
  <text class="label" x="676" y="94">Top-1 full</text>
  <text class="label" x="676" y="116">abstract</text>

  <rect class="box accent" x="778" y="52" width="190" height="96" rx="10"/>
  <text class="label" x="873" y="88">M2 Qwen2.5-3B</text>
  <text class="detail" x="873" y="116">mixed-evidence LoRA</text>

  <rect class="box output" x="995" y="52" width="165" height="96" rx="10"/>
  <text class="label" x="1077.5" y="84">Decision</text>
  <text class="detail" x="1077.5" y="109">rationale</text>
  <text class="detail" x="1077.5" y="129">sentence IDs</text>
</svg>
